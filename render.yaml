services:
  - type: web
    name: rag-college-chatbot
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: EMBEDDING_MODEL
        value: Xenova/all-MiniLM-L6-v2
      - key: TOP_K
        value: "5"
      - key: SIMILARITY_THRESHOLD
        value: "0.25"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
